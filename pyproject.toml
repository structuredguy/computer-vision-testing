[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytemplate-workspace"
version = "0.1.0"
description = "Python workspace template for Antigravity with Marimo support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "marimo>=0.10.0",
    "pandas",
    "openpyxl",
    "pint",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
extraPaths = ["src"]
include = ["src", "tests", "nb"]
